name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Site (Copy docs and create redirects)
        run: |
          # Копируем папку docs в отдельную папку site
          cp -r docs site
          
          # Копируем README в site (чтобы была главная)
          cp README.md site/index.md
          
          # Создаем .nojekyll, чтобы GitHub Pages не вмешивался
          touch site/.nojekyll
          
          # МАГИЯ: Создаем HTML-редиректы для всех .md файлов
          find site -name "*.md" ! -name "index.md" | while read file; do
            # Получаем путь без .md (например, site/en/cli)
            base="${file%.md}"
            
            # Создаем папку с таким же именем, как файл, но БЕЗ .md
            # И проверяем, не существует ли она уже
            mkdir -p "$base"
            
            # Создаем index.html внутри, который просто отдает контент файла
            cat > "$base/index.html" <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
          </head>
          <body>
            <div id="content"></div>
            <script>
              fetch('$(basename "$file")') // Загружаем исходный .md файл
                .then(response => response.text())
                .then(text => {
                  document.getElementById('content').innerHTML = marked.parse(text);
                });
            </script>
          </body>
          </html>
          EOF
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4