name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Единственное действие: копируем README в docs
      - name: Prepare Docs
        run: |
          # Для английского README: заменяем "docs/" на "/" в ссылках
          sed 's|](docs/|](|g' README.md | sed 's|README\.ru\.md|ru/|g' > docs/index.md
          
          # 2. Русская версия (docs/ru/index.md)
          # Сначала обрабатываем обычные ссылки на файлы (.md -> ./file.md)
          sed -e 's|](docs/ru/|](|g' \
              -e 's|](\([a-zA-Z0-9_-]*\.md\)|](\./\1|g' README.ru.md > docs/ru/index.md
              
          # А теперь жестко правим ссылку переключения языка на главную
          # Ищем текст "](README.md)" и меняем его на "](../)"
          sed -i 's|](README\.md)|](../)|g' docs/ru/index.md
          
          # Точечная замена шапки
          sed -i 's#\[English\](README\.md)#[English](../)#g' docs/ru/index.md
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
