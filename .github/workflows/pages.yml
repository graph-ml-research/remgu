name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docs
        run: |
          # English version: strip "docs/" prefix and point Russian link to "ru/"
          sed 's|](docs/|](|g' README.md | sed 's|README\.ru\.md|ru/|g' > docs/index.md
          
          # 2. Russian version: strip "docs/ru/" prefix and make links relative (./file.md)
          sed -e 's|](docs/ru/|](|g' \
              -e 's|](\([a-zA-Z0-9_-]*\.md\)|](\./\1|g' README.ru.md > docs/ru/index.md
              
          # Fix language switcher in Russian README using Python
          # This reliably replaces the exact string and avoids sed escaping issues
          python -c "
          import pathlib
          p = pathlib.Path('docs/ru/index.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('[English](README.md)', '[English](../)')
          text = text.replace('[English](./README.md)', '[English](../)')
          p.write_text(text, encoding='utf-8')
          "
          # Copy the "examples" folder to docs
          mkdir -p docs/examples
          cp -r examples/* docs/examples/
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
