name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Site (Copy docs and create redirects)
        run: |
          # Копируем папку docs в отдельную папку site
          cp -r docs site
          
          # Создаем .nojekyll, чтобы GitHub Pages не вмешивался
          touch site/.nojekyll
          
          # 1. ФИКС ГЛАВНОЙ СТРАНИЦЫ: 
          # Вместо index.md создаем index.html, который загрузит README.md
          # (предварительно скопировав README.md в папку site)
          cp README.md site/README.md
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
            <style>body { max-width: 800px; margin: 40px auto; font-family: sans-serif; line-height: 1.6; }</style>
          </head>
          <body>
            <div id="content"></div>
            <script>
              fetch('README.md')
                .then(response => response.text())
                .then(text => {
                  document.getElementById('content').innerHTML = marked.parse(text);
                });
            </script>
          </body>
          </html>
          EOF
          
          # 2. ФИКС ОСТАЛЬНЫХ ССЫЛОК (.md)
          find site -name "*.md" ! -name "index.md" ! -name "README.md" | while read file; do
            base="${file%.md}"
            mkdir -p "$base"
            
            cat > "$base/index.html" <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
            <style>body { max-width: 800px; margin: 40px auto; font-family: sans-serif; line-height: 1.6; }</style>
          </head>
          <body>
            <div id="content"></div>
            <script>
              fetch('$(basename "$file")')
                .then(response => response.text())
                .then(text => {
                  document.getElementById('content').innerHTML = marked.parse(text);
                });
            </script>
          </body>
          </html>
          EOF
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4