name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Единственное действие: копируем README в docs
      - name: Prepare Docs
        run: |
          # 1. Копируем README, но сразу заменяем ссылки вида "docs/en/cli.md" на "en/cli.md"
          # Это нужно, потому что jekyll-relative-links не видит файлы за пределами папки docs/
          sed 's|](docs/|](/|g' README.md > docs/index.md
          
          # 2. Если нужен русский README, делаем то же самое для него
          if [ -f README.ru.md ]; then
            sed 's|](docs/|](/|g' README.ru.md > docs/README.ru.md
          fi
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
