name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Единственное действие: копируем README в docs
      - name: Prepare Docs
        run: |
          # Для английского README: заменяем "docs/" на "/" в ссылках
          sed 's|](docs/|](/|g' README.md > docs/index.md
          
          # Для русского README:
          # 1. Заменяем "docs/" на "/" в ссылках
          # 2. Сохраняем в файл docs/ru.md (или docs/ru/index.md, если создашь папку)
          mkdir -p docs/ru
          sed 's|](docs/|](/|g' README.ru.md > docs/ru/index.md
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
